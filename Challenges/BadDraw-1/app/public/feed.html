<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8" />
<meta name="viewport" content="width=device-width, initial-scale=1" />
<title>Feed</title>
<link rel="stylesheet" href="/styles.css" />
</head>
<body>
<div class="shell">
  <div class="topbar">
    <div class="brand">
      <canvas class="brand-mark" width="32" height="32" id="markCanvas"></canvas>
      <div class="brand-name">Bad<span>Draw 1</span></div>
    </div>
    <div class="actions">
      <div class="welcome" id="welcome"></div>
      <button class="btn-ghost" id="logoutBtn">Logout</button>
    </div>
  </div>

  <section class="hero">
    <div class="hero-text">
      <span class="eyebrow">Pixel studio</span>
      <h1>Unleash your <b>pixel passion</b></h1>
      <p>Paint on a 16&times;16 canvas, drop it on the community wall and see what everyone else is making.</p>
      <button class="btn-primary" id="open-draw-window">Create New Drawing</button>
    </div>
    <div class="hero-tags" aria-hidden="true">
      <span class="tag t1">Draw</span>
      <span class="tag px t2">16x16</span>
      <span class="tag t3">Share</span>
      <span class="tag t4">Pixel</span>
      <span class="tag t5">Remix</span>
      <span class="tag px t6" style="background:#16141c">Retro</span>
      <span class="tag t7">Gallery</span>
      <span class="tag t8">Community</span>
    </div>
  </section>

  <div class="section-head">
    <h2 class="section-title">Community Creations</h2>
    <span class="section-chip">Fresh pixels</span>
  </div>

  <div id="gallery" class="gallery"></div>
  <div id="emptyState" class="empty-state" style="display:none;"><em>No drawings yet. Be the first to create one!</em></div>
</div>

<script src="/pixel-avatar.js"></script>
<script src="/script.js"></script>
</body>
</html>
